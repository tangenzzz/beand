name: saf_folder
description: "bean'd: a folder picked through the Storage Access Framework, kept across restarts, and safe file writes into it (auto backup)."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: app.beand.saf_folder
        pluginClass: SafFolderPlugin
